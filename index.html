<html lang="en" data-theme="light">
<head>

<script src="config.js"></script>

<style>
:root{--bg:#eef6fd;--bg2:#d9ecfb;--cd:rgba(255,255,255,.74);--bd:rgba(110,165,220,.3);--tx:#0f2740;--mu:#5d7a96;--pr:#38a9f0;--ac:#1479d4;--in:#fff;--hd:rgba(238,246,253,.86);--sh:0 10px 30px rgba(30,100,170,.12);--gl:0 8px 26px rgba(56,169,240,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06132a;--bg2:#0b2347;--cd:rgba(15,42,82,.66);--bd:rgba(90,160,235,.26);--tx:#eaf4ff;--mu:#8fb2d4;--ac:#4db4ff;--in:#0d2850;--hd:rgba(6,19,42,.86);--sh:0 10px 30px rgba(0,0,0,.35);--gl:0 0 28px rgba(56,169,240,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06132a;--bg2:#0b2347;--cd:rgba(15,42,82,.66);--bd:rgba(90,160,235,.26);--tx:#eaf4ff;--mu:#8fb2d4;--ac:#4db4ff;--in:#0d2850;--hd:rgba(6,19,42,.86);--sh:0 10px 30px rgba(0,0,0,.35);--gl:0 0 28px rgba(56,169,240,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;font:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hd);backdrop-filter:blur(14px)}
b,strong{font-weight:700}a{cursor:pointer}
#app{display:flex;max-width:1200px;margin:auto}
aside{width:250px;padding:18px;position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;max-height:100vh;overflow:auto}
main{flex:1;min-width:0;padding:0 18px 130px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:10px;align-items:center;padding:12px 0;background:var(--hd);backdrop-filter:blur(14px)}
.sbar{flex:1;display:flex;gap:8px;align-items:center;padding:11px 16px;border-radius:99px;background:var(--in);border:1px solid var(--bd);color:var(--mu);cursor:pointer}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(12px)}
.bt{border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,var(--pr),#1479d4);color:#fff;font-weight:600;cursor:pointer;box-shadow:var(--gl)}
.bt.g{background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);cursor:pointer;position:relative;flex:none}
input,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);outline:0}
input:focus,textarea:focus{border-color:var(--pr);box-shadow:var(--gl)}
.nv{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;color:var(--mu);cursor:pointer;margin-bottom:2px}
.nv:hover{background:var(--cd)}.nv.on{background:linear-gradient(135deg,var(--pr),#1479d4);color:#fff;box-shadow:var(--gl)}
.nv.sb{padding:6px 14px 6px 44px;font-size:14px}.nv.on2{color:var(--ac);font-weight:600}
.nb{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--hd);backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
.ni{display:grid;justify-items:center;font-size:11px;color:var(--mu);padding:6px 12px;border-radius:16px;cursor:pointer}.ni span{font-size:21px}.ni.on{color:var(--ac);background:rgba(56,169,240,.16)}
.fab{position:fixed;right:20px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#5cc0ff,#1479d4);color:#fff;font-size:30px;box-shadow:var(--gl);cursor:pointer}
.h1{font-size:24px;font-weight:700}.h3{font-size:16px;font-weight:700;margin:6px 0}.mu{color:var(--mu)}
.tr{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:10px;align-items:center}.fw{flex-wrap:wrap}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sc{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.ch{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--in);color:var(--mu);cursor:pointer;white-space:nowrap}.ch.on{background:#1479d4;color:#fff;border-color:#1479d4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center}.cal i{aspect-ratio:1}.cal small{color:var(--mu);font-size:11px}.cdy{aspect-ratio:1;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;padding:0}.cdy.off{opacity:.45}.cdy.fut{opacity:.3;cursor:default}.cdy.gp{background:#2fbf71;color:#fff;border-color:#2fbf71}.cdy.gm{background:#f5a524;color:#fff;border-color:#f5a524}.cdy.ga{background:#ff5d6c;color:#fff;border-color:#ff5d6c}.cdy.tdy{outline:2px solid var(--ac);outline-offset:1px}.cdy.sel{box-shadow:0 0 0 3px var(--ac)}.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:10px}.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.hero{background:linear-gradient(135deg,#5cc0ff,#1479d4);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--gl);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.18)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;font-size:12px;position:relative;z-index:1}.st strong{display:block;font-size:26px}
.qc{text-align:center;cursor:pointer;transition:transform .2s}.qc:hover{transform:translateY(-3px)}
.qi{font-size:30px;width:56px;height:56px;margin:0 auto 6px;border-radius:20px;background:var(--bg2);display:grid;place-items:center}
.sj{min-width:92px;text-align:center;display:grid;gap:2px;cursor:pointer;padding:12px}.sj.on{outline:2px solid var(--pr)}
.fi{width:46px;height:46px;border-radius:16px;background:var(--bg2);display:grid;place-items:center;font-size:22px;flex:none}
.ab{display:flex;gap:6px}.ab .ib{width:34px;height:34px;border-radius:12px}
.av{border-radius:50%;background:linear-gradient(135deg,#7cc9ff,#1479d4);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none}
.dot{position:absolute;top:-4px;right:-4px;background:#ff5d6c;color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;font-style:normal}
.tg{width:48px;height:28px;border-radius:99px;background:#b8cfe3;position:relative;cursor:pointer;flex:none;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--pr)}.tg.on::after{left:23px}
.ml{display:flex;flex-direction:column;gap:12px;padding:10px 0}.mg{display:flex;flex-direction:column;gap:3px;align-items:flex-start}.mg.me{align-items:flex-end;align-self:flex-end}
.bb{max-width:min(82vw,520px);padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--cd);border:1px solid var(--bd);overflow-wrap:anywhere}
.me .bb{background:linear-gradient(135deg,var(--pr),#1479d4);color:#fff;border-radius:18px 18px 6px 18px}
.rp{font-size:12px;opacity:.75;border-left:3px solid currentColor;padding-left:6px;margin-bottom:4px}.mn{font-weight:700;color:var(--ac)}.me .mn{color:#fff;text-decoration:underline}
.ma{display:flex;gap:10px;font-size:13px;padding:0 6px}
.cp{display:flex;gap:8px;position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));margin-top:12px}
.hl{outline:2px solid var(--pr);box-shadow:var(--gl)}.bd2{background:var(--pr);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}.tm{font-weight:700;color:var(--ac);width:52px}
.pb{width:100%;margin-top:8px;text-align:left}
.pr2{position:relative;display:flex;justify-content:space-between;padding:10px 14px;margin-top:8px;border-radius:14px;background:var(--in);overflow:hidden;border:1px solid var(--bd)}.pr2 i{position:absolute;left:0;top:0;bottom:0;background:rgba(56,169,240,.3)}.pr2 span{position:relative}
.bn2{display:block;font-size:26px}
.bk{position:fixed;inset:0;background:rgba(5,20,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.sh{width:100%;max-width:520px;background:var(--bg);color:var(--tx);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;border:1px solid var(--bd)}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:99;width:max-content;max-width:90vw}
.t{background:#0f2740;color:#fff;padding:10px 16px;border-radius:14px;margin-top:6px;box-shadow:var(--sh)}
#sp{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;transition:opacity .4s;font-size:80px}
@media(max-width:899px){aside{display:none}.nb{display:flex}.fab{bottom:calc(88px + env(safe-area-inset-bottom,0px))}.fab.up{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
@media(min-width:900px){.mlogo{display:none}.cp{bottom:16px}.fab{bottom:28px}}
@media(min-width:600px){.bk{align-items:center}.sh{border-radius:28px}}
</style>
</head>
<body>
<div id="app"></div><div id="ov"></div><div id="ts"></div><div id="sp"></div>
<script>
const $=s=>document.querySelector(s);
const LOGO='<svg viewBox="0 0 48 48" width="1em" height="1em"><rect width="48" height="48" rx="14" fill="#2a9df0"/><path d="M9 17c5-2 10-1 15 2 5-3 10-4 15-2v18c-5-2-10-1-15 2-5-3-10-4-15-2z" fill="#fff"/><path d="M24 19v18" stroke="#2a9df0" stroke-width="2"/><circle cx="36" cy="11" r="6" fill="#fff"/><circle cx="36" cy="11" r="2.4" fill="#2a9df0"/></svg>';
const SUB=new Proxy({cad:['📐','CAD & EA'],pps:['💻','PPS'],phy:['⚡','Physics'],ele:['🔌','Electrical'],mat:['📖','Mathematics'],oth:['➕','Other Subjects']},{get:(t,k)=>k in t||typeof k=='symbol'?t[k]:['📘','Other']});
const P=[['msg','💬','Send Messages'],['files','📄','Share PDFs & Files'],['photos','📸','Share Photos'],['videos','🎥','Share Videos'],['links','🔗','Share Links']];
const DY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TT={Mon:[[9,'phy','Room 101','Dr. Rao'],[11,'mat','Room 101','Prof. Sen'],[14,'pps','Lab 2','Ms. Iyer']],Tue:[[9,'cad','Studio A','Mr. Das'],[11,'ele','Room 103','Dr. Nair'],[14,'phy','Lab 1','Dr. Rao']],Wed:[[9,'pps','Room 102','Ms. Iyer'],[11,'mat','Room 101','Prof. Sen'],[14,'cad','Studio A','Mr. Das']],Thu:[[9,'ele','Room 103','Dr. Nair'],[11,'pps','Lab 2','Ms. Iyer'],[14,'mat','Room 101','Prof. Sen']],Fri:[[9,'phy','Room 101','Dr. Rao'],[11,'cad','Studio A','Mr. Das'],[14,'ele','Lab 3','Dr. Nair']],Sat:[[9,'mat','Room 101','Prof. Sen']]};
const NAV=[['home','🏠','Home'],['study','📚','Study Hub'],['chat','💬','Class Chat'],['asg','📝','Assignments'],['tt','📅','Timetable'],['att','✅','Attendance'],['ann','📢','Announcements'],['polls','📊','Polls'],['saved','⭐','Saved']];
const MN=[['home','🏠','Home'],['study','📚','Materials'],['chat','💬','Chat'],['tt','📅','Schedule'],['me','👤','Profile']];
const seed=()=>({user:null,admin:false,theme:'light',view:'home',sub:'',fl:'all',day:'',q:'',saved:[],reply:null,unread:0,
perms:{msg:1,files:1,photos:1,videos:1,links:1},
files:[{id:1,n:'Physics Unit 2 Notes.pdf',t:'PDF',s:'2.4 MB',sub:'phy',c:'Notes',by:'Riya',d:'Oct 21',imp:1,w:1,k:'braggs law bragg xray diffraction'},
{id:2,n:'Important Questions – Unit 2.pdf',t:'PDF',s:'820 KB',sub:'phy',c:'Important Questions',by:'Kabir',d:'Oct 20',imp:1,w:1,k:'braggs law'},
{id:3,n:'Physics Question Paper 2025.pdf',t:'PDF',s:'1.1 MB',sub:'phy',c:'Previous Papers',by:'Admin',d:'Oct 12',k:'braggs law'},
{id:4,n:'PPS Lab Manual.docx',t:'DOCX',s:'640 KB',sub:'pps',c:'Lab Materials',by:'Meera',d:'Oct 18'},
{id:5,n:'CAD Drawing Sheet 3.pptx',t:'PPTX',s:'5.8 MB',sub:'cad',c:'Assignments',by:'Admin',d:'Oct 19',imp:1,w:1},
{id:6,n:'Mathematics Formula Sheet.pdf',t:'PDF',s:'300 KB',sub:'mat',c:'Notes',by:'Arjun',d:'Oct 15'},
{id:7,n:'Circuit Analysis Notes.pdf',t:'PDF',s:'3.2 MB',sub:'ele',c:'Notes',by:'Riya',d:'Oct 14'}],
msgs:[{id:1,u:'Riya',t:'9:12 AM',x:'Unit 2 notes are up (Bragg’s Law, X-ray diffraction) 📄',r:{'👍':2},pin:1},{id:2,u:'Kabir',t:'9:20 AM',x:'Thanks! Is the PPS lab on Thursday?'},{id:3,u:'Admin',t:'9:25 AM',x:'Yes, Room 204 at 11. @everyone please bring your manuals.'}],
ann:[{id:1,t:'Mid-sem exams start Nov 10',b:'Detailed timetable will be shared this week. Keep checking here.',pin:1,d:'Oct 22'},{id:2,t:'CAD sheet 3 submission',b:'Submit by Friday 5 PM in the drawing room.',d:'Oct 20'}],
asg:[{id:1,sub:'cad',t:'Drawing Sheet 3',b:'Isometric views of the given block.',due:'2026-10-27',done:0},{id:2,sub:'pps',t:'Lab Program Set 4',b:'Programs 1–5 on arrays.',due:'2026-10-25',done:0},{id:3,sub:'mat',t:'Problem Set 6',b:'Chapter 5 exercises.',due:'2026-10-30',done:1}],
polls:[{id:1,q:'When should we submit the assignment?',o:[['Monday',3],['Tuesday',5],['Wednesday',2]],v:null}],
mem:['Riya','Kabir','Meera','Arjun'],
nt:[]});
let S;try{S=JSON.parse(localStorage.getItem('classhub')||'null')}catch(e){}
S=S||seed();Object.assign(S,{att:{},user:null,admin:false,files:[],msgs:[],ann:[],polls:[],mem:[],perms:{msg:1,files:1,photos:1,videos:1,links:1}});
const SH=['files','msgs','ann','polls','asg'],LS={},SEEN={},cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,c)=>(a[c]=v[c],a),{}):v);
let DB,UID,AS,DLS,ON=1,LP='';
const lim=e=>toast(e&&e.code=='quota_exceeded'?'The class storage is full.':'Something went wrong. Please try again.');
const push=()=>{if(!DB||!UID||!S.user||!CID||S.ro)return;SH.forEach(k=>{const cur={},old=LS[k]||{};S[k].forEach(x=>{cur[x.id]=cj(x)});Object.keys(cur).forEach(id=>{if(old[id]!==cur[id])DB.collection(k).doc(id).set(JSON.parse(cur[id])).catch(lim)});Object.keys(old).forEach(id=>{if(!(id in cur))DB.collection(k).doc(id).delete().catch(lim)});LS[k]=cur});if(S.admin&&cj(S.perms)!==LP){LP=cj(S.perms);DB.doc('cfg/perms').set(S.perms).catch(lim)}};
const save=()=>{try{const{files,msgs,ann,polls,asg,mem,att,...L}=S;localStorage.setItem('classhub',JSON.stringify(L))}catch(e){}push()};
let A=2,R=0,MEM=0,SF='all',SQ='',n0=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/['’]/g,'');
const can=k=>S.admin||S.perms[k];
const toast=m=>{const e=document.createElement('div');e.className='t';e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),2600)};
const note=x=>{S.nt.unshift((CN?'['+CN+'] ':'')+x);S.nt=S.nt.slice(0,20);S.unread++};
const go=(v,s)=>{S.view=v;S.sub=s||'';S.q='';render();scrollTo(0,0)};
const sheet=h=>{$('#ov').innerHTML='<div class=bk onclick="if(event.target===this)closeOv()"><div class=sh>'+h+'</div></div>'};
const closeOv=()=>{$('#ov').innerHTML=''};
const ask=(m,f)=>{window.cb=f;sheet(`<p style="margin-bottom:16px"><b>${m}</b></p><div class=row style="justify-content:flex-end"><button class="bt g" onclick=closeOv()>Cancel</button><button class=bt onclick="closeOv();cb()">Confirm</button></div>`)};
const empty=(e,t)=>`<div class=cd style="text-align:center;padding:30px"><div style="font-size:40px">${e}</div><p class=mu>${t}</p></div>`;
const av=(n,z=36)=>`<span class=av style="width:${z}px;height:${z}px;font-size:${z*.42}px">${esc((n||'?')[0].toUpperCase())}</span>`;
const ic=t=>({PDF:'📕',DOCX:'📘',DOC:'📘',PPTX:'📙',PPT:'📙',XLSX:'📗',XLS:'📗',IMG:'🖼️',VID:'🎞️',ZIP:'🗜️'}[t]||'📄');
/* auth */
const authV=()=>!MEM?'<p class=mu style="padding:40px;width:100%;text-align:center">Loading CLASS HUB…</p>':`<div style="min-height:90dvh;width:100%;display:grid;place-items:center;padding:20px"><div class=cd style="width:100%;max-width:400px;text-align:center;padding:28px"><div style="font-size:64px;line-height:1">${LOGO}</div><h1 class=h1 style="margin-top:12px">CLASS HUB</h1><p class=mu>Your Class. Your Space. Everything in One Place.</p><div style="margin-top:22px;display:grid;gap:12px;text-align:left">${A==0?`<button class="bt g" onclick="A=2;render()">🔵 Continue with Google</button><div class=mu style="text-align:center">or</div><input id=ph type=tel placeholder="Mobile number"><button class=bt onclick=sendOtp()>Send OTP</button>`:A==1?`<p class=mu>Enter the 4-digit code (demo: any 4 digits)</p><input id=otp inputmode=numeric maxlength=4 placeholder="••••"><button class=bt onclick=verify()>Verify</button>`:`<b>Set your name</b><input id=nm maxlength=30 placeholder="Your name"><button class=bt onclick=enter()>Enter class</button>`}</div><p class=mu style="margin-top:16px;font-size:12px">Signed in securely with your account.</p></div></div>`;
const pickR=n=>{R=n;$('#r0').classList.toggle('on',!n);$('#r1').classList.toggle('on',!!n)};
const sendOtp=()=>{if($('#ph').value.replace(/\D/g,'').length<8)return toast('Enter a valid mobile number.');A=1;render()};
const verify=()=>{if($('#otp').value.length<4)return toast('Enter the 4-digit code.');A=2;render()};
const enter=()=>{const n=$('#nm').value.trim();if(!n)return toast('Please set your name.');DB.doc('members/'+UID).set({name:n}).then(()=>note('Welcome to CLASS HUB, '+n+' 👋')).catch(lim)};
/* files */
const fr=f=>`<div class="cd row fw"><div class=fi>${ic(f.t)}</div><div style="flex:1;min-width:140px"><b class=tr>${esc(f.n)}</b><div class=mu style="font-size:12px">${f.t} · ${f.s} · ${SUB[f.sub][1]} · ${f.c} · ${esc(f.by)} · ${f.d}${f.imp?' · ⭐ Important':''}</div></div><div class=ab><button class=ib title="Save" onclick="sv(${f.id})">${S.saved.includes(f.id)?'★':'☆'}</button>${S.admin?`<button class=ib title="Mark important" onclick="imp(${f.id})">📌</button>`:''}<button class=ib title="Download" onclick="dl(${f.id})">⬇️</button>${S.admin||f.by==S.user.name?`<button class=ib title="Delete" onclick="delF(${f.id})">🗑️</button>`:''}</div></div>`;
const list=()=>{const q=norm(S.q||'');const a=S.files.filter(f=>(!S.sub||f.sub==S.sub)&&(!q||norm(f.n+f.c+(f.k||'')).includes(q))&&(S.fl=='all'||(S.fl=='imp'&&f.imp)||(S.fl=='new'&&f.w)||(S.fl=='sv'&&S.saved.includes(f.id)))).sort((x,y)=>y.id-x.id);return a.length?a.map(fr).join(''):empty('📂','No files match your search.')};
const sv=id=>{S.saved=S.saved.includes(id)?S.saved.filter(x=>x!=id):[...S.saved,id];render()};
const imp=id=>{const f=S.files.find(x=>x.id==id);f.imp=f.imp?0:1;render()};
const delF=id=>ask('Delete this file?',()=>{S.files=S.files.filter(x=>x.id!=id);render()});
